<!doctype html><html><body><form>
<!-- react-select: a visible combobox plus an invisible required-validation input beside it -->
<div class="field"><label for="q1">Do you have the right to work in the UK?*</label>
  <div class="select"><input id="q1" role="combobox" aria-autocomplete="list" aria-required="true">
  <input required tabindex="-1" style="opacity:0;width:100%;height:10px" value=""></div></div>
<!-- Ashby-style radios with no name attribute -->
<fieldset><legend>How did you hear about ExampleVoice?</legend>
  <label><input type="radio" value="a"> Job board</label>
  <label><input type="radio" value="b"> Referral</label>
  <label><input type="radio" value="c"> Other (please specify)</label></fieldset>
<div class="field"><label for="u">Which university did you last attend?</label>
  <select id="u"><option>Select...</option><option>Christian Brothers University</option><option>Other (School Not Listed)</option></select></div>
<div class="field"><label for="hs">High School Name*</label><input id="hs" required></div>
</form></body></html>
