<!doctype html><html><head><meta charset="utf-8"><title>Full-Stack Engineer @ ExampleVoice</title>
<style>.field{margin:12px 0}.title{display:block;font-weight:600}.upload{position:relative}
.upload input[type=file]{position:absolute;opacity:0;width:1px;height:1px}[role=listbox]{list-style:none;margin:0;padding:0}
[role=option]{padding:4px;cursor:pointer}</style></head><body>
<h1>Full-Stack Engineer</h1>
<form id="f">
 <div class="field"><label for="_systemfield_name" class="title">Name<span>*</span></label><input id="_systemfield_name" required></div>
 <div class="field"><label for="_systemfield_email" class="title">Email<span>*</span></label><input id="_systemfield_email" type="email" required></div>
 <div class="field"><label class="title">Resume<span>*</span></label><div class="upload"><button type="button">Upload File</button><input type="file" id="resume"></div></div>
 <div class="field"><label class="title">Where are you located?<span>*</span></label>
   <div><input role="combobox" aria-autocomplete="list" placeholder="Start typing..." id="loc"><ul role="listbox" id="lb"></ul></div></div>
 <div class="field"><label class="title">How did you hear about ExampleVoice?</label>
   <div class="radios">
     <span><input type="radio" name="heard" id="h1" value="1"><label for="h1">Job board</label></span>
     <span><input type="radio" name="heard" id="h2" value="2"><label for="h2">Social media (LinkedIn, Instagram, X etc)</label></span>
     <span><input type="radio" name="heard" id="h3" value="3"><label for="h3">Referral</label></span>
     <span><input type="radio" name="heard" id="h4" value="4"><label for="h4">Other (please specify)</label></span>
   </div></div>
 <div class="field"><label class="title">If other, please specify below</label><input placeholder="Type here..."></div>
 <div class="field"><label class="title">Link to your Github profile<span>*</span></label><input placeholder="Type here..." required></div>
 <div class="field"><label class="title">Link to your LinkedIn profile<span>*</span></label><input placeholder="Type here..." required></div>
 <div class="field"><label class="title">Why ExampleVoice, and why now?</label><textarea placeholder="Type here..."></textarea></div>
 <div class="field"><label class="title">What's the most impactful thing you've built? What was your specific contribution?</label><textarea placeholder="Type here..."></textarea></div>
 <div class="field"><label class="title">How did you know it worked? What did success actually look like?</label><textarea placeholder="Type here..."></textarea></div>
 <div class="field"><label class="title">Have you used ExampleVoice - even in a personal or side project? What did you build or explore?</label><textarea placeholder="Type here..."></textarea></div>
 <button type="submit">Submit Application</button>
</form>
<script>
const CITIES = ["London, England, United Kingdom", "Londonderry, Northern Ireland, United Kingdom", "London, Ontario, Canada"];
const loc = document.getElementById('loc'), lb = document.getElementById('lb');
loc.addEventListener('input', () => {
  lb.innerHTML = '';
  setTimeout(() => {
    for (const c of CITIES.filter(c => c.toLowerCase().startsWith(loc.value.toLowerCase()) && loc.value.length > 2)) {
      const li = document.createElement('li'); li.setAttribute('role', 'option'); li.textContent = c;
      li.onclick = () => { loc.value = c; lb.innerHTML = ''; }; lb.appendChild(li);
    }
  }, 150);
});
document.getElementById('f').addEventListener('submit', e => { e.preventDefault();
  document.body.innerHTML = '<h1>Thank you for applying!</h1><p>Your application has been received.</p>'; });
</script></body></html>
