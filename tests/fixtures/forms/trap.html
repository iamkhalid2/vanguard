<!doctype html><html><head><meta charset="utf-8"><title>Trap form</title></head><body>
<!-- The 2026-10-19 bug: two unwired labels share one container, so "first label in the container" gave
     the Location box the label "Name". Plus a field with no label at all, and a Workable-style fieldset. -->
<form id="t">
 <div class="row"><label>Name</label><input id="a"><label>Location</label><input id="b"></div>
 <div class="row"><input id="orphan"></div>
 <fieldset><legend>Are you currently eligible to work in United Kingdom?*</legend>
   <label><input type="radio" name="elig" value="yes" style="position:absolute;opacity:0"><span>Yes</span></label>
   <label><input type="radio" name="elig" value="no" style="position:absolute;opacity:0"><span>No</span></label>
 </fieldset>
 <div><span>Please select the top 3 engineer profile types below that are most relevant to your interests</span>
   <label><input type="checkbox" name="types" value="be">Backend</label>
   <label><input type="checkbox" name="types" value="fe">Frontend</label>
   <label><input type="checkbox" name="types" value="fs">Full-stack</label>
   <label><input type="checkbox" name="types" value="mob">Mobile</label>
   <label><input type="checkbox" name="types" value="ai">AI/ML</label></div>
 <button type="submit">Submit</button>
</form>
<script>document.getElementById('t').addEventListener('submit', e => { e.preventDefault();
  document.body.innerHTML = '<p>We have received your application.</p>'; });</script></body></html>
